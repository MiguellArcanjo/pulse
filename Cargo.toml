[workspace]
resolver = "2"
members = [
    "crates/pulse-protocol",
    "crates/pulse-db",
    "crates/pulse-ipc",
    "crates/pulse-core",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
pulse-protocol = { path = "crates/pulse-protocol" }
pulse-db = { path = "crates/pulse-db" }
pulse-ipc = { path = "crates/pulse-ipc" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
