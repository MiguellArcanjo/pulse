name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (Rust + TypeScript)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Rust fmt
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Tipos TS gerados estão atualizados
        shell: bash
        run: |
          pnpm gen:protocol
          git diff --exit-code -- packages/protocol/src/generated \
            || (echo "::error::Rode 'pnpm gen:protocol' e faça commit dos tipos gerados." && exit 1)

      - name: TypeScript
        run: pnpm typecheck

      - name: Testes do cliente (HMAC compatível com o Core)
        run: pnpm --filter @pulse/client test

      - name: Build do frontend Desktop
        run: pnpm --filter @pulse/desktop build
