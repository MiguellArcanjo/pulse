[package]
name = "pulse-desktop"
description = "Pulse Desktop: interface administrativa (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# O sufixo `_lib` evita conflito de nome entre lib e bin no Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "pulse_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pulse-protocol.workspace = true
pulse-ipc.workspace = true
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
