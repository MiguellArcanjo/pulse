[package]
name = "pulse-core"
description = "Pulse Core: processo em segundo plano que monitora e controla o PC"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pulse-core"
path = "src/main.rs"

[dependencies]
pulse-protocol.workspace = true
pulse-db.workspace = true
pulse-ipc.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
base64 = "0.23"
getrandom = "0.4"
hmac = "0.13"
sha2 = "0.11"
serde.workspace = true
futures.workspace = true
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.30"
