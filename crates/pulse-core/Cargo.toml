[package]
name = "pulse-core"
description = "Pulse Core: processo em segundo plano que monitora e controla o PC"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pulse-core"
path = "src/main.rs"

[dependencies]
pulse-protocol.workspace = true
pulse-db.workspace = true
pulse-ipc.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network"] }
